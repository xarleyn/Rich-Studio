[advisories]
# Maintenance advisory, not a patched chrono release: all chrono versions are
# affected. rmcp 3.11.0 still requires chrono, so updating the SDK cannot remove it.
# https://github.com/chronotope/chrono/issues/1768
# https://github.com/modelcontextprotocol/rust-sdk/blob/rmcp-v3.11.0/crates/rmcp/Cargo.toml
# Revisit by 2026-12-17; tests/rust/architecture.rs enforces the deadline because
# the pinned cargo-deny 0.20.2 accepts only id/reason, without native expiry.
ignore = [
    { id = "RUSTSEC-2026-0543", reason = "Unmaintained chrono is required by rmcp and schemars; current upstream SDK still depends on it and no chrono upgrade resolves the advisory; review-by=2026-12-17" },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[licenses]
private = { ignore = true }
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
