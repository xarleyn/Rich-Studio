# First public launch from source: one VPS, no image registry credentials or S3 account required.
name: richpost
services:
  rich-studio:
    build:
      context: ..
    env_file: .env
    environment:
      STUDIO_MODE: server
      STUDIO_URL: https://${STUDIO_DOMAIN:?STUDIO_DOMAIN in deploy/.env}
      TG_BOT_TOKEN_FILE: /run/secrets/tg_bot_token
      FORWARDED_ALLOW_IPS: "*"  # only the proxy reaches the backend, no public backend port
    secrets: [tg_bot_token]
    volumes: [data:/data]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: ${APP_MEMORY_LIMIT:-512m}
    cpus: 1.0
    pids_limit: 256
    restart: unless-stopped
    stop_grace_period: 60s
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  caddy:
    image: caddy:2.11.7-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    environment:
      STUDIO_DOMAINS: ${STUDIO_DOMAINS:-${STUDIO_DOMAIN}}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: ${PROXY_MEMORY_LIMIT:-128m}
    restart: unless-stopped
    depends_on: [rich-studio]
    logging: *logging

volumes:
  data:
  caddy_data:
  caddy_config:

secrets:
  tg_bot_token:
    file: ./secrets/tg_bot_token
