# First public launch from source: one VPS, no image registry credentials or S3 account required.
name: richpost
services:
  rich-studio:
    build:
      context: ..
    env_file: .env
    environment:
      STUDIO_MODE: server
      STUDIO_URL: https://${STUDIO_DOMAIN:?STUDIO_DOMAIN in deploy/.env}
      TG_BOT_TOKEN_FILE: /run/secrets/tg_bot_token
      FORWARDED_ALLOW_IPS: "*"  # only the proxy reaches the backend, no public backend port
    secrets: [tg_bot_token]
    volumes: [data:/data]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: ${APP_MEMORY_LIMIT:-512m}
    cpus: 1.0
    pids_limit: 256
    restart: unless-stopped
    stop_grace_period: 60s
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  caddy:
    image: caddy:2.11.7-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    environment:
      STUDIO_DOMAINS: ${STUDIO_DOMAINS:-${STUDIO_DOMAIN}}
      HTTPS_PROXY: ${ACME_PROXY_URL:-}
      HTTP_PROXY: ${ACME_PROXY_URL:-}
      NO_PROXY: rich-studio,localhost,127.0.0.1,::1
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: ${PROXY_MEMORY_LIMIT:-128m}
    restart: unless-stopped
    depends_on: [rich-studio]
    logging: *logging

  egress:
    profiles: [proxy]
    image: ghcr.io/sagernet/sing-box:v1.14.4@sha256:0788ffbddab2c68a99a2dd4780bbc50902f159af6f589df3ee74a8389d278279
    command: ["-D", "/tmp", "-c", "/run/secrets/egress.json", "run"]
    user: "10002:10002"
    secrets: [egress_config]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: ${EGRESS_MEMORY_LIMIT:-96m}
    environment:
      GOMEMLIMIT: 64MiB
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 3128"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 3s
    restart: unless-stopped
    logging: *logging

volumes:
  data:
  caddy_data:
  caddy_config:

secrets:
  tg_bot_token:
    file: ./secrets/tg_bot_token
  egress_config:
    file: ${EGRESS_CONFIG_FILE:-./secrets/egress.json}
