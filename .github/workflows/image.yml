name: image
# The studio's image in GHCR for the server (deploy/docker-compose.yml), with build provenance and an SBOM
# from buildx. Every push to main rebuilds it as :latest (plus :main and :<sha>), amd64 only: a QEMU arm64
# build on every commit would be slow; full amd64+arm64 stays for a v* tag (:<version> and :<sha>) and a
# manual run (Actions → image → Run workflow, or `gh workflow run image.yml --ref main`) — run one if the
# server is arm64. The repo is public, so the package is public too: no PAT needed to pull.
# No actions/attest-build-provenance: artifact attestations need GitHub Enterprise Cloud.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4   # arm64 RUN steps on the amd64 runner
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}     # lowercased: ghcr.io/xarleyn/rich-studio
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,format=long,prefix=
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          # a push to a branch: amd64 only (fast); a tag push or a manual run: also arm64 via QEMU
          platforms: ${{ github.ref_type == 'branch' && github.event_name == 'push' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
