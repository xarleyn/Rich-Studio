name: deploy

# Manual releases from the reviewed default branch. PRs never receive the SSH key.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: "SSH, выкладка, HTTPS или выборочный Trojan"
        type: choice
        options: [check, deploy, tls-check, tls-retry, proxy-enable]
        default: check
        required: true
      confirm_tls_retry:
        description: "Для tls-retry введите: CONFIRM_TLS_RETRY"
        type: string
        default: ""
        required: false

permissions:
  contents: read

concurrency:
  group: richpost-production
  cancel-in-progress: false

jobs:
  ssh:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configure SSH with the pinned server key
        env:
          RICHPOST_SSH_KEY: ${{ secrets.RICHPOST_SSH_KEY }}
          RICHPOST_SSH_HOST: ${{ secrets.RICHPOST_SSH_HOST }}
          RICHPOST_SSH_USER: ${{ secrets.RICHPOST_SSH_USER }}
          RICHPOST_SSH_KNOWN_HOSTS: ${{ secrets.RICHPOST_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [[ -z "$RICHPOST_SSH_KEY" || -z "$RICHPOST_SSH_HOST" || -z "$RICHPOST_SSH_USER" || -z "$RICHPOST_SSH_KNOWN_HOSTS" ]]; then
            echo 'Сначала выполните deploy/setup-github-ssh.sh на VPS.' >&2
            exit 1
          fi
          [[ "$RICHPOST_SSH_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$RICHPOST_SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          umask 077
          printf '%s\n' "$RICHPOST_SSH_KEY" > "$RUNNER_TEMP/richpost-key"
          printf '%s\n' "$RICHPOST_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/richpost-known-hosts"
          ssh-keygen -y -f "$RUNNER_TEMP/richpost-key" > /dev/null
          ssh-keygen -F "$RICHPOST_SSH_HOST" -f "$RUNNER_TEMP/richpost-known-hosts" > /dev/null
          cat > "$RUNNER_TEMP/richpost-ssh-config" <<EOF
          Host richpost
            HostName $RICHPOST_SSH_HOST
            User $RICHPOST_SSH_USER
            Port 22
            IdentityFile $RUNNER_TEMP/richpost-key
            UserKnownHostsFile $RUNNER_TEMP/richpost-known-hosts
            StrictHostKeyChecking yes
            BatchMode yes
            IdentitiesOnly yes
            ConnectTimeout 15
            ServerAliveInterval 15
            ServerAliveCountMax 3
          EOF
      - name: Check SSH and the installed service
        run: |
          ssh -F "$RUNNER_TEMP/richpost-ssh-config" richpost 'bash -se' <<'REMOTE'
          test "$(id -u)" = 0
          test -s /opt/richpost/deploy/.env
          test -s /opt/richpost/deploy/secrets/tg_bot_token
          docker compose version
          docker compose -f /opt/richpost/deploy/compose.simple.yml ps
          echo 'SSH к RichPost работает.'
          REMOTE
      - name: Upload and deploy this exact commit
        if: inputs.operation == 'deploy' || inputs.operation == 'proxy-enable'
        run: |
          set -euo pipefail
          if [[ '${{ inputs.operation }}' == proxy-enable ]]; then
            ssh -F "$RUNNER_TEMP/richpost-ssh-config" richpost \
              'test -s /opt/richpost/deploy/secrets/trojan.url'
          fi
          git archive --format=tar.gz -o "$RUNNER_TEMP/richpost-$GITHUB_SHA.tar.gz" \
            HEAD app Dockerfile .dockerignore requirements.lock deploy
          scp -F "$RUNNER_TEMP/richpost-ssh-config" "$RUNNER_TEMP/richpost-$GITHUB_SHA.tar.gz" \
            "richpost:/tmp/richpost-$GITHUB_SHA.tar.gz"
          ssh -F "$RUNNER_TEMP/richpost-ssh-config" richpost "bash -s -- $GITHUB_SHA" < deploy/update.sh
      - name: Enable the private selective Trojan proxy
        if: inputs.operation == 'proxy-enable'
        run: |
          ssh -F "$RUNNER_TEMP/richpost-ssh-config" richpost 'bash /opt/richpost/deploy/setup-proxy.sh'
      - name: Check access to the certificate authority
        if: inputs.operation == 'tls-check'
        run: |
          ssh -F "$RUNNER_TEMP/richpost-ssh-config" richpost 'bash -se' <<'REMOTE'
          problem=0
          interface=$(awk '$2 == "00000000" {print $1; exit}' /proc/net/route)
          if [[ -n "$interface" && -f "/sys/class/net/$interface/mtu" ]]; then
            printf 'host MTU: %s\n' "$(cat "/sys/class/net/$interface/mtu")"
          fi
          docker compose -f /opt/richpost/deploy/compose.simple.yml exec -T caddy \
            cat /sys/class/net/eth0/mtu 2>/dev/null | sed 's/^/container MTU: /' || true
          for endpoint in production staging; do
            if [[ "$endpoint" == production ]]; then
              url=https://acme-v02.api.letsencrypt.org/directory
            else
              url=https://acme-staging-v02.api.letsencrypt.org/directory
            fi
            for family in 4 6; do
              code=0
              curl "-$family" --fail --silent --connect-timeout 5 --max-time 15 \
                --output /dev/null "$url" > /dev/null 2>&1 || code=$?
              printf 'host IPv%s %s: exit=%s\n' "$family" "$endpoint" "$code"
            done
            code=0
            docker compose -f /opt/richpost/deploy/compose.simple.yml exec -T caddy \
              wget -q -T 15 -O /dev/null "$url" > /dev/null 2>&1 || code=$?
            printf 'container %s: exit=%s\n' "$endpoint" "$code"
            code=0
            docker compose -f /opt/richpost/deploy/compose.simple.yml exec -T rich-studio \
              python -c 'import sys, urllib.request, settings; proxy = settings.get().telegram_proxy; opener = urllib.request.build_opener(urllib.request.ProxyHandler({"https": proxy}) if proxy else urllib.request.ProxyHandler({})); opener.open(sys.argv[1], timeout=20).close()' \
              "$url" > /dev/null 2>&1 || code=$?
            printf 'configured app route %s: exit=%s\n' "$endpoint" "$code"
            if [[ "$code" != 0 ]]; then problem=1; fi
          done
          exit "$problem"
          REMOTE
      - name: Retry automatic certificate provisioning
        if: inputs.operation == 'tls-retry' && inputs.confirm_tls_retry == 'CONFIRM_TLS_RETRY'
        run: |
          ssh -F "$RUNNER_TEMP/richpost-ssh-config" richpost 'bash -se' <<'REMOTE'
          docker compose -f /opt/richpost/deploy/compose.simple.yml restart caddy > /dev/null 2>&1
          echo 'Caddy перезапущен. Выпуск сертификата нужно проверить отдельно.'
          REMOTE
      - name: Remove runner credentials
        if: always()
        run: |
          rm -f -- "$RUNNER_TEMP/richpost-key" "$RUNNER_TEMP/richpost-known-hosts" \
            "$RUNNER_TEMP/richpost-ssh-config"
