name: ci
on:
  pull_request:
  push:
    branches: [main]
  # new CVEs appear without any push: the audit and the image scan also run weekly on main
  schedule:
    - cron: "17 5 * * 1"

# read-only token: no job here writes to the repository
permissions:
  contents: read

# agents push several times in a row: only the newest run of a PR matters; main keeps every run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# runners pinned: ubuntu-latest moved to 26.04, where the Playwright browser install is not yet
# validated; move together with the Playwright version (Dependabot bumps it)
jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: pinned Rust toolchain and quality tools
        run: |
          rustup show active-toolchain
          cargo install cargo-nextest --version 0.9.151 --locked
          cargo install cargo-deny --version 0.20.2 --locked
          cargo install cargo-machete --version 0.9.2 --locked
      - run: make check-rust

  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: PYTHONPATH=app lint-imports --no-cache
      - run: pytest --cov --cov-report=term-missing

  js:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run test:lock
      - run: npx eslint .
      - run: npx tsc -p .
      - run: npx playwright install --with-deps chromium
      - run: npm run test:render
      - run: npm run test:formats
      - run: npm run test:source
      - run: npm run test:i18n
      - run: npm run test:parity
      - run: npm run test:shots
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: preview-screenshots
          path: test-results/preview/

  e2e:
    runs-on: ubuntu-24.04
    needs: [rust, python]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: pip install -r requirements.txt
      - run: npm ci && npx playwright install --with-deps chromium
      - run: cargo build --locked --bin rich-studio
      - run: npm run test:docs
      - name: unchanged browser scenarios against isolated Rust and mock Telegram
        run: node scripts/check-rust-browser.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: editor-screenshots
          path: test-results/ui/

  # known vulnerabilities in pinned dependencies, and secrets anywhere in the history
  # (pre-commit runs gitleaks too, but agents and the web editor do not run pre-commit)
  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: pip install pip-audit && pip-audit -r requirements.txt -r requirements-dev.txt
      # retained Python reference dependency closure; Rust dependencies are audited by cargo deny
      - run: pip-audit --require-hashes --disable-pip -r requirements.lock
      - run: npm audit --audit-level=high
      - name: gitleaks (same version as .pre-commit-config.yaml)
        run: docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --no-banner

  # the image builds, starts and answers; critical fixable CVEs in it fail the build
  docker:
    runs-on: ubuntu-24.04
    needs: [rust, python]
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t rich-studio .
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: installed Rust image, native commands, persisted data and graceful stop
        run: IMAGE=rich-studio node scripts/check-rust-container.mjs
      - name: image scan
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.1 image \
            --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress rich-studio

  # Runs last: one external tgfake process, so it is kept out of the fast matrix.
  tgfake:
    runs-on: ubuntu-24.04
    needs: [rust, python, js, e2e, docker]
    env:
      TGFAKE_VERSION: "1.4.1"
    steps:
      - uses: actions/checkout@v7
      - name: pinned Rust toolchain
        run: rustup show active-toolchain
      - name: install tgfake with checksum
        run: |
          set -euo pipefail
          base="https://github.com/EvilFreelancer/tgfake/releases/download/v${TGFAKE_VERSION}"
          asset="tgfake_${TGFAKE_VERSION}_linux_amd64.tar.gz"
          mkdir -p "$RUNNER_TEMP/tgfake"
          curl -fsSL -o "$RUNNER_TEMP/$asset" "$base/$asset"
          curl -fsSL -o "$RUNNER_TEMP/tgfake-checksums.txt" "$base/checksums.txt"
          (cd "$RUNNER_TEMP" && grep -F "  $asset" tgfake-checksums.txt | sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP/tgfake"
          echo "TGFAKE_BIN=$RUNNER_TEMP/tgfake/tgfake" >> "$GITHUB_ENV"
      - run: cargo test --locked --test tgfake -- --ignored --test-threads=1
