<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#3390ec">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>RichPost — нет подключения / Offline</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: light-dark(#f4f6f8, #17212b); color: light-dark(#17212b, #eef3f8); }
    main { width: min(480px, calc(100% - 48px)); padding: 32px 0; }
    .brand { color: #3390ec; font-size: 24px; font-weight: 700; }
    h1 { font-size: 28px; margin-top: 32px; }
    p { line-height: 1.6; }
    .en { opacity: .75; }
    a { display: inline-block; padding: 12px 20px; margin-top: 12px; background: #3390ec; color: #fff; border-radius: 10px; text-decoration: none; font-weight: 600; }
    a:focus-visible { outline: 3px solid currentColor; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <div class="brand">RichPost</div>
    <h1>Нет подключения</h1>
    <p>Для открытия студии нужен интернет. Сохранённые черновики останутся в вашей учётке. Подключитесь к сети и откройте приложение снова.</p>
    <p class="en" lang="en">You're offline. Connect to the internet to open the studio. Saved drafts stay in your account.</p>
    <a href="/">Открыть студию / Open studio</a>
  </main>
</body>
</html>
